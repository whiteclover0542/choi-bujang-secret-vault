<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오프라인 | 비밀 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101a28; color: #ecf4ff; }
    main { max-width: 520px; padding: 24px; }
    p { line-height: 1.7; color: #bfd0e5; }
  </style>
</head>
<body>
  <main>
    <h1>지금은 오프라인입니다</h1>
    <p>자료실은 서버가 로그인과 기기 승인을 확인한 뒤에만 자료를 보여 줍니다. 그래서 자료를 이 기기에 저장해 두지 않으며, 오프라인에서는 메모를 볼 수 없습니다.</p>
    <p>인터넷에 다시 연결한 뒤 새로고침해 주세요.</p>
  </main>
</body>
</html>
