<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a28">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <title>탈환 작전실 | 최 부장 비밀 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 860px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(28px, 6vw, 42px); }
    p, td, th { line-height: 1.6; }
    p { color: #bfd0e5; }
    table { width: 100%; border-collapse: collapse; margin: 18px 0; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #51667c; vertical-align: top; }
    th { color: #8ad8df; font-size: 14px; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: 13px; white-space: nowrap; }
    .measured { background: #1f4d3a; color: #b8f0d2; }
    .not-run { background: #4d3a1f; color: #f0dcb8; }
    .bad { background: #612a35; color: #ffe3e8; }
    .meta { font-size: 14px; color: #8ad8df; }
    a { color: #8ad8df; }
    .error { color: #ffb3c0; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 12단계 탈환 작전실</div>
    <h1>탈환 작전실</h1>
    <p>이 화면은 서버가 이번 요청에서 직접 읽은 값만 "실측"으로, 근거 자료가 없는 항목은 "미실행"으로 표시합니다. 이 화면의 문구는 통과 근거가 아니며, 판정은 심판의 실제 시험으로 합니다. 메모 본문은 표시하지 않습니다.</p>
    <p class="meta" id="meta">요약을 불러오는 중입니다.</p>
    <p class="error" id="error" role="alert"></p>
    <table id="summary" hidden>
      <thead><tr><th>항목</th><th>값</th><th>근거</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p><a href="/">자료실로 돌아가기</a></p>
  </main>
  <script type="module">
    // 로그인 세션·기기 ID는 서버의 HttpOnly 쿠키로만 확인합니다. 이 스크립트는 토큰을 읽거나 저장하지 않습니다.
    const $ = id => document.getElementById(id);
    const SOURCE = { server_db: ['실측 · 서버 DB', 'measured'], server_file: ['실측 · 배포 파일', 'measured'], not_run: ['미실행', 'not-run'] };
    const tag = (source, bad = false) => {
      const [label, cls] = SOURCE[source] ?? ['알 수 없음', 'not-run'];
      const span = document.createElement('span');
      span.className = 'tag ' + (bad ? 'bad' : cls);
      span.textContent = bad ? label + ' · 불일치' : label;
      return span;
    };
    const row = (name, value, source, bad = false) => {
      const tr = document.createElement('tr');
      const [a, b, c] = [document.createElement('td'), document.createElement('td'), document.createElement('td')];
      a.textContent = name; b.textContent = value; c.append(tag(source, bad));
      tr.append(a, b, c);
      return tr;
    };
    const fmt = obj => Object.entries(obj ?? {}).map(([k, v]) => k + ' ' + v).join(', ') || '없음';

    const response = await fetch('/api/ops/summary', { cache: 'no-store', credentials: 'same-origin' });
    const s = await response.json().catch(() => ({}));
    if (!response.ok) {
      $('meta').textContent = '';
      $('error').textContent = (response.status === 401 ? '로그인이 필요합니다.' : response.status === 403 ? '승인된 기기에서만 작전실을 열 수 있습니다.' : (s.message ?? '요약을 불러오지 못했습니다.')) + ' (HTTP ' + response.status + ')';
    } else {
      $('meta').textContent = '확인 시각 ' + s.checkedAt + ' · 요청 ID ' + (s.requestId ?? '없음');
      const r = s.recovery ?? {};
      $('rows').append(
        row('판정기 규칙', (s.decider.ruleIds ?? []).join(', '), s.decider.source),
        row('판정기 허용 경로·구역', s.decider.routeCount + '개 (' + fmt(s.decider.zones) + ')', s.decider.source),
        row('내 메모 · 공지', s.data.myNotes + '건 · ' + s.data.notices + '건', s.data.source),
        row('이 기기 승인 상태', s.devices.thisDevice, s.devices.source),
        row('내 기기 기록', fmt(s.devices.mine), s.devices.source),
        row('복구 정책 버전', r.version ? r.version + ' (사본 해시 ' + (r.backupHashVerified ? '확인' : '불일치') + ', 현재 판정기 ' + (r.currentMatchesBackup ? '같음' : '다름') + ')' : (r.error ?? '없음'), 'server_file', r.version && !(r.backupHashVerified && r.currentMatchesBackup)),
        row('내 복원 기록', r.myRestores + '건' + (r.lastRestore ? ' · 최근 ' + r.lastRestore.result + ' (' + r.lastRestore.at + ')' : ''), r.source),
        row('탐지 사건', s.detection.reason + ' · 규칙: ' + s.detection.rule, s.detection.source),
        row('회수 상태', s.revocation.reason, s.revocation.source),
      );
      $('summary').hidden = false;
    }
  </script>
</body>
</html>
